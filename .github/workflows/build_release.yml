name: Build & Release Standalone Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Executable (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Standalone Application
        run: |
          python scripts/build_exe.py

      - name: Compress Release Archive
        shell: pwsh
        run: |
          Compress-Archive -Path dist\NinjaOne-Compliance-Dashboard\* -DestinationPath NinjaOne-Compliance-Dashboard-Windows-x64.zip

      - name: Create GitHub Release & Upload Asset
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: NinjaOne-Compliance-Dashboard-Windows-x64.zip
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
